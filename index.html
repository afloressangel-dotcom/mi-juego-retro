<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego</title>
  
  <!-- Tipografía Retro Pixel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       VARIABLES Y PALETA RETRO REFINADA (PALETA AZUL CLARO / CIAN)
       ========================================================================== */
    :root {
      --bg-dark: #040d1a;
      --card-bg: #0b1a30;
      --border-white: #ffffff;
      --accent-blue: #00bcd4;       /* Azul Cian Principal */
      --accent-light-blue: #80deea; /* Azul Claro Destacado */
      --text-soft: #e0f7fa;
      --gold: #ffd700;
      --shadow-black: rgba(0, 0, 0, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--border-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 30%, #0d2847 0%, var(--bg-dark) 85%),
        radial-gradient(2px 2px at 20px 30px, var(--accent-light-blue), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, var(--accent-blue), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 100% 100%, 200px 200px, 260px 260px, 150px 150px, 300px 300px;
    }

    /* EFECTO CRT SCANLINES */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.7;
    }

    .game-wrapper {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      position: relative;
    }

    .pixel-box {
      background: var(--card-bg);
      border: 4px solid var(--border-white);
      box-shadow: 
        0 0 0 4px var(--bg-dark), 
        0 0 0 8px var(--accent-blue),
        10px 10px 0px 8px var(--shadow-black);
      padding: 28px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 22px;
      border-radius: 2px;
    }

    .top-menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px dashed var(--accent-light-blue);
      padding-bottom: 14px;
      gap: 8px;
    }

    .game-logo-text {
      font-size: 9px;
      color: var(--accent-light-blue);
      text-shadow: 2px 2px #000;
      letter-spacing: 0.5px;
    }

    .controls-group {
      display: flex;
      gap: 8px;
    }

    .btn-pixel {
      background: var(--border-white);
      color: var(--bg-dark);
      border: none;
      padding: 12px 16px;
      font-size: 10px;
      cursor: pointer;
      position: relative;
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        inset -4px -4px 0 0 #aaa;
      transition: transform 0.08s ease, background-color 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      text-decoration: none;
    }

    .btn-pixel:hover {
      background: #e8e8e8;
      transform: translateY(-2px);
    }

    .btn-pixel:active {
      transform: translateY(2px);
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        inset 4px 4px 0 0 #666;
    }

    .btn-blue {
      background: var(--accent-blue);
      color: #000;
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        inset -4px -4px 0 0 #008ba3;
    }
    .btn-blue:hover { background: #33c9dc; }

    .btn-light-blue {
      background: var(--accent-light-blue);
      color: var(--bg-dark);
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        inset -4px -4px 0 0 #4ba3e3;
    }
    .btn-light-blue:hover { background: #b2ebf2; }

    .btn-gold {
      background: var(--gold);
      color: #000;
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        inset -4px -4px 0 0 #b39700;
    }
    .btn-gold:hover { background: #ffe44d; }

    .btn-small {
      padding: 8px 10px;
      font-size: 8px;
    }

    .screen-view {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .screen-view.active {
      display: flex;
    }

    .title-wrapper h1 {
      font-size: 22px;
      letter-spacing: 4px;
      color: var(--accent-light-blue);
      text-shadow: 3px 3px 0 var(--accent-blue), -2px -2px 0 #000;
      animation: pulseTitle 2s infinite alternate ease-in-out;
      margin-top: 6px;
    }

    @keyframes pulseTitle {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    .pixel-star {
      font-size: 28px;
      color: var(--accent-light-blue);
      text-shadow: 0 0 10px var(--accent-blue), 3px 3px 0 #000;
      margin: 16px auto;
      animation: starTwinkle 1.5s infinite alternate ease-in-out;
    }

    @keyframes starTwinkle {
      0% { transform: scale(0.9) rotate(-5deg); opacity: 0.8; }
      100% { transform: scale(1.1) rotate(5deg); opacity: 1; }
    }

    .home-desc {
      font-size: 9px;
      line-height: 1.8;
      color: var(--text-soft);
      max-width: 380px;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border: 2px dashed rgba(0, 188, 212, 0.4);
    }

    .puzzle-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--accent-light-blue);
      font-size: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background: #000;
      border: 2px solid #fff;
      padding: 2px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-blue);
      transition: width 0.3s ease-in-out;
    }

    .riddle-card {
      width: 100%;
      background: #000;
      border: 3px solid var(--accent-light-blue);
      padding: 22px 16px;
      font-size: 10px;
      line-height: 1.8;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--border-white);
      box-shadow: inset 0 0 10px rgba(0, 188, 212, 0.15);
    }

    .hint-box {
      width: 100%;
      background: rgba(255, 215, 0, 0.1);
      border: 2px dashed var(--gold);
      color: var(--gold);
      padding: 10px;
      font-size: 8px;
      line-height: 1.6;
      display: none;
      text-align: center;
    }

    .hint-box.active {
      display: block;
    }

    .input-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .pixel-input {
      width: 100%;
      max-width: 380px;
      background: #000;
      border: 3px solid var(--border-white);
      color: var(--border-white);
      padding: 12px;
      font-size: 11px;
      text-align: center;
      outline: none;
      text-transform: lowercase;
    }

    .pixel-input:focus {
      border-color: var(--accent-light-blue);
      box-shadow: 0 0 10px var(--accent-blue);
    }

    .feedback-message {
      font-size: 10px;
      min-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback-correct {
      color: #4eff7b;
      text-shadow: 1px 1px #000;
    }

    .feedback-wrong {
      color: #ff5252;
      animation: shakeInput 0.3s ease-in-out;
    }

    @keyframes shakeInput {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .chests-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 440px;
      margin: 10px 0;
    }

    .pixel-chest {
      width: 44px;
      height: 38px;
      background: #1b3d54;
      border: 3px solid #000;
      position: relative;
      box-shadow: inset 0 -6px 0 #0d2331;
      transition: transform 0.2s, background-color 0.2s;
    }

    .pixel-chest::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 17px;
      width: 8px;
      height: 7px;
      background: var(--gold);
      border: 2px solid #000;
    }

    .pixel-chest.open {
      background: #2b597a;
      animation: chestPop 0.4s ease forwards;
    }

    .pixel-chest.open::after {
      top: 5px;
      background: var(--accent-light-blue);
    }

    @keyframes chestPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .final-secret-text {
      font-size: 16px;
      line-height: 1.6;
      color: var(--accent-light-blue);
      text-shadow: 3px 3px 0 #000, 0 0 12px var(--accent-blue);
      margin: 15px 0;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 1s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .final-secret-text.visible {
      opacity: 1;
      transform: scale(1);
    }

    @media (max-width: 480px) {
      .pixel-box { padding: 20px 14px; }
      .title-wrapper h1 { font-size: 18px; }
      .riddle-card { font-size: 9px; line-height: 1.6; padding: 16px 10px; }
      .btn-pixel { font-size: 9px; padding: 10px 12px; }
      .final-secret-text { font-size: 13px; }
      .game-logo-text { font-size: 7px; }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="pixel-box">
      
      <!-- Menú Superior -->
      <header class="top-menu">
        <div class="game-logo-text">✨ SECRETO 8-BIT</div>
        <div class="controls-group">
          <button id="btn-audio" class="btn-pixel btn-small">SFX: OFF</button>
          <button id="btn-reset" class="btn-pixel btn-small btn-light-blue">REINICIAR</button>
        </div>
      </header>

      <!-- PANTALLA 1: Inicio -->
      <section id="screen-home" class="screen-view active">
        <div class="title-wrapper">
          <h1>JUEGO</h1>
        </div>
        
        <div class="pixel-star">✦</div>
        
        <p class="home-desc">
          Resuelve los acertijos de ingenio. Tu progreso se guardará automáticamente en este dispositivo.
        </p>

        <button id="btn-start" class="btn-pixel btn-blue" style="width: 85%; margin-top: 10px;">
          INICIAR JUEGO
        </button>
      </section>

      <!-- PANTALLA 2: Acertijos -->
      <section id="screen-puzzle" class="screen-view">
        <div class="puzzle-status-bar">
          <span id="puzzle-tracker">ACERTIJO 1/8</span>
          <button id="btn-hint" class="btn-pixel btn-small btn-gold">PISTA 💡</button>
        </div>

        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <div class="riddle-card" id="riddle-text">
          Cargando acertijo...
        </div>

        <div class="hint-box" id="hint-box">
          <!-- Pista renderizada dinámicamente -->
        </div>

        <div class="input-wrapper">
          <input type="text" id="answer-input" class="pixel-input" placeholder="Escribe tu respuesta..." autocomplete="off" spellcheck="false">
          
          <div class="feedback-message" id="feedback-msg"></div>

          <div style="display: flex; gap: 10px; width: 100%; justify-content: center; max-width: 380px;">
            <button id="btn-submit" class="btn-pixel btn-blue" style="flex: 1;">ENVIAR</button>
            <button id="btn-next" class="btn-pixel btn-light-blue" style="display: none; flex: 1;">SIGUIENTE ►</button>
          </div>
        </div>
      </section>

      <!-- PANTALLA 3: Pantalla Final -->
      <section id="screen-final" class="screen-view">
        <h2 style="font-size: 11px; color: var(--accent-light-blue); line-height: 1.5;">¡HAS RESUELTO TODOS LOS ENIGMAS!</h2>
        <p style="font-size: 8px; color: #aaa;">Abriendo los cofres del secreto...</p>

        <div class="chests-grid" id="chests-grid">
          <!-- Generado dinámicamente -->
        </div>

        <div id="secret-reveal" class="final-secret-text">
          ✦ Un pequeño beso ✦
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px;">
          <button id="btn-share" class="btn-pixel btn-blue">COMPARTIR LOGRO 🔗</button>
          <button id="btn-replay" class="btn-pixel btn-light-blue">VOLVER A JUGAR</button>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
